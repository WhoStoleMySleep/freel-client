version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      # Small bumps go in one PR: CI runs the whole suite either way, and nobody
      # reads ten separate merge requests a week.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    ignore:
      # The plugin resolves its own sqlx; a mismatch here would hand the Rust
      # commands a different pool than the one the plugin opened, and the
      # transactions they exist for would silently stop being transactions.
      - dependency-name: sqlx
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: chore
