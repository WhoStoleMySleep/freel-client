name: Release

on:
  push:
    tags: ['v*']
  # Собирает те же установщики без релиза — чтобы проверить их до тега.
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon и Intel — отдельные сборки: универсальный бинарник
          # Tauri собрать умеет, но тогда и зависимости нужны под обе арки.
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg
          # Не latest: deb линкуется с glibc сборочной машины, а на более новой
          # он перестанет ставиться на системы постарше.
          - os: ubuntu-22.04
            target: ''
            label: linux-x64
            bundles: deb
          - os: windows-latest
            target: ''
            label: windows-x64
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # По умолчанию Tauri делает все форматы разом: под Linux к deb добавился
      # бы AppImage, который тащит в себе webkit2gtk и весит вдесятеро больше,
      # под Windows — ещё и msi. Один формат на систему, остальные не нужны.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Пустой tagName — сборка без релиза: так работает ручной запуск.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: freel ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # upload-artifact сохраняет путь от корня репозитория, поэтому установщик
      # переезжает отдельно: иначе внутри архива он лежит в самом конце цепочки
      # src-tauri/target/…/bundle/. Каталог берётся вне репозитория: внутри после
      # сборки уже лежит dist — симлинк на .output/public, его создаёт Nuxt.
      #
      # Путь задан до каталога формата: рядом Tauri оставляет и распакованный
      # пакет, и временный образ, из которого собирается dmg, а нужен один файл.
      - name: Collect the installer
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installer"
          find src-tauri/target -type f \
            \( -path '*/release/bundle/dmg/*.dmg' \
            -o -path '*/release/bundle/deb/*.deb' \
            -o -path '*/release/bundle/nsis/*.exe' \) \
            -exec mv {} "$RUNNER_TEMP/installer/" \;
          ls -la "$RUNNER_TEMP/installer"

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: freel-${{ matrix.label }}
          path: ${{ runner.temp }}/installer/*
          if-no-files-found: error

  android:
    # Черновик релиза создаёт bundle; APK доливается в уже существующий.
    needs: bundle
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NDK качается заново каждый раз: восстановленный из кеша теряет права на
      # запуск, и сборка падает на линковке с «command not found».
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          local-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: pnpm install --frozen-lockfile

      # Ключ подписи постоянный: Android ставит обновление поверх только при
      # совпадении подписи, иначе приложение сносится вместе с базой.
      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see README, the APK cannot be signed without it"
            exit 1
          fi
          cd src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > release.jks
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$ALIAS" "$PASSWORD" "$PWD/release.jks" > keystore.properties

      # Без разделения выходит один APK на все ABI: телефону нужны нативные
      # библиотеки под его процессор, а несёт он ещё три чужих комплекта и
      # весит 78 МБ вместо двадцати с небольшим.
      - run: pnpm tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # Gradle зовёт варианты сборки arm64 и arm, тогда как система на телефоне
      # называет те же наборы arm64-v8a и armeabi-v7a. В имени файла стоит ABI,
      # прочитанный из самого пакета, — по нему человек и выбирает, что качать.
      - name: Name the APKs after the release
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          # У тега слэшей не бывает, а у ветки при ручном запуске — сплошь и
          # рядом, и в имени файла они превращаются в несуществующие каталоги.
          name="${GITHUB_REF_NAME//\//-}"
          for f in src-tauri/gen/android/app/build/outputs/apk/*/release/*-release.apk; do
            abi=$(unzip -Z1 "$f" 'lib/*' | cut -d/ -f2 | sort -u | head -1)
            mv "$f" "$RUNNER_TEMP/apk/freel-${name}-${abi}.apk"
          done
          ls -la "$RUNNER_TEMP/apk"

      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/apk/*.apk --clobber

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: freel-android
          path: ${{ runner.temp }}/apk/*
          if-no-files-found: error
